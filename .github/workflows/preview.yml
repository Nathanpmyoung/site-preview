# Rebuilds the noindex preview from the static-site branch of nathanpmyoung.github.io,
# the same steps the live workflow runs. Delete this repo once the live site switches.
on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths: [.github/workflows/preview.yml]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nathanpmyoung/nathanpmyoung.github.io
          ref: static-site
          fetch-depth: 0
      - uses: logseq/publish-spa@v0.2.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 sitegen/test_gate.py
      - run: python3 sitegen/build.py --spa www --out "$RUNNER_TEMP/site" --noindex
      - run: python3 sitegen/gate.py --out "$RUNNER_TEMP/site"
      - run: |
          rm "$RUNNER_TEMP/site/CNAME"
          mkdir -p "$RUNNER_TEMP/site/.github/workflows"
          cp "$GITHUB_WORKSPACE/../preview.yml" "$RUNNER_TEMP/site/.github/workflows/" 2>/dev/null || curl -sf https://raw.githubusercontent.com/nathanpmyoung/site-preview/gh-pages/.github/workflows/preview.yml -o "$RUNNER_TEMP/site/.github/workflows/preview.yml"
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ runner.temp }}/site
          branch: gh-pages
